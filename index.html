<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH e Michel | Ecossistema Oficial & Backstage Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        :root {
            --bg-stage-950: #09090B;
            --bg-stage-900: #121216;
            --bg-stage-800: #1C1C22;
            --bg-stage-700: #272730;
            --gold-300: #FDE68A;
            --gold-400: #FBBF24;
            --gold-500: #F59E0B;
            --gold-600: #D97706;
            --text-main: #F4F4F5;
            --text-muted: #A1A1AA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-stage-950);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: rgba(9, 9, 11, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(39, 39, 48, 0.8);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .header-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0;
            gap: 0.75rem;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, var(--gold-400) 0%, var(--gold-600) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.2);
            font-weight: 900;
            color: #000;
            font-size: 1.125rem;
            letter-spacing: -0.05em;
        }

        .brand-title {
            font-weight: 800;
            font-size: 1.125rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            background: rgba(245, 158, 11, 0.15);
            color: var(--gold-400);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.125rem;
        }
